name: Deploy Benchmark Report

on:
  push:
    branches: [main]
    paths:
      - 'results/index.html'
      - 'results/CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static report
        run: |
          mkdir -p _site
          cp results/index.html _site/index.html
          if [ -f results/CNAME ]; then cp results/CNAME _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
